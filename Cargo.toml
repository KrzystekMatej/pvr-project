[workspace]
resolver = "3"
members = [
    "crates/engine",
    "crates/app",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
env_logger = "0.11.11"
log = "0.4.34"
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3 